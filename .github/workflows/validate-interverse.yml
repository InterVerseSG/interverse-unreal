name: Validate InterVerseSG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project data and configuration
        run: python Scripts/validate_interverse_project.py

      - name: Validate Quest VR menu
        run: python Scripts/validate_vr_menu.py

      - name: Validate Quest navigation HUD
        run: python Scripts/validate_vr_hud.py

      - name: Validate Quest NavMesh architecture
        run: python Scripts/validate_quest_navmesh.py

      - name: Validate Quest controller pointer
        run: python Scripts/validate_quest_pointer.py

      - name: Check InterVerse API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://interverse-api-yhqx.onrender.com/healthz

      - name: Check InterVerse Builder health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            https://interverse-builder.onrender.com/healthz

      - name: Smoke test Gemini to Builder navigation
        run: python Scripts/smoke_test_cloud_navigation.py
